<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private PDF Tools – Free Offline PDF Editor: Merge, Split, Compress, Sign</title>
<meta name="description" content="Free, open-source PDF tools that run 100% in your browser. Merge, split, compress, sign, rotate, reorder, watermark, add page numbers, convert PDF to images and images to PDF. No uploads, no sign-up, works offline.">
<meta name="keywords" content="pdf tools, pdf editor, merge pdf, combine pdf, split pdf, compress pdf, sign pdf, e-signature, rotate pdf, reorder pdf pages, delete pdf pages, pdf to jpg, pdf to png, jpg to pdf, image to pdf, watermark pdf, page numbers, pdf metadata, remove pdf metadata, offline pdf, private pdf, client-side pdf, browser pdf, free pdf tool, open source, ilovepdf alternative, smallpdf alternative">
<meta name="theme-color" content="#1F4BFF">
<meta property="og:title" content="Private PDF Tools – Free offline PDF editor">
<meta property="og:description" content="Merge, split, compress and sign PDFs entirely in your browser. Your files never leave your device.">
<meta property="og:type" content="website">
<meta property="og:image" content="docs/screenshot.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 3h11l7 7v19H8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M19 3v7h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><rect x="12" y="16" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M14 16v-2a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div>
        <h1>Private PDF Tools</h1>
        <p class="tagline">Your files stay on this device. Nothing is uploaded.</p>
      </div>
    </div>
    <label class="btn btn-primary" for="file-input">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add files
    </label>
    <input id="file-input" type="file" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp,image/gif,image/bmp" multiple hidden>
  </header>

  <nav class="tools" id="tools" aria-label="Tools"></nav>

  <main class="workspace">
    <section class="library" id="library" aria-label="Your files"></section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <span>Runs 100% in your browser with <a href="https://pdf-lib.js.org" target="_blank" rel="noopener">pdf-lib</a> and <a href="https://mozilla.github.io/pdf.js/" target="_blank" rel="noopener">PDF.js</a>.</span>
    <span>Open source, MIT licensed.</span>
  </footer>
</div>

<div class="dropveil" id="dropveil" hidden><div>Drop PDFs or images to add them</div></div>
<div class="busy" id="busy" hidden><div class="busy-card"><div class="spinner"></div><div id="busy-text">Working…</div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="vendor/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
